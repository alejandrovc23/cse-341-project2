services:
  - type: web
    name: cse-341-project2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: library_api
